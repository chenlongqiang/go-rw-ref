# 推送 v* 标签时：打包 VSIX → 创建 GitHub Release → 发布到扩展市场。
#
# 市场发布为可选步骤：
# - VS Code Marketplace：在 Marketplace 发布者管理页配置 Trusted Publishing，
#   并在仓库 Settings → Secrets and variables → Actions → Variables 中设置
#   PUBLISH_MARKETPLACE=true。无需保存任何令牌。
# - Open VSX：在仓库 Secrets 中设置 OVSX_PAT。未设置时自动跳过。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验标签与 package.json 版本一致
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 package.json 版本 v${VERSION} 不一致" >&2
            exit 1
          fi

      - run: npm ci
      - run: bash scripts/package.sh

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.vsix --title "${GITHUB_REF_NAME}" --generate-notes

      - name: 发布到 VS Code Marketplace
        if: ${{ vars.PUBLISH_MARKETPLACE == 'true' }}
        run: npx vsce publish --packagePath dist/*.vsix --oidc

      - name: 发布到 Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish dist/*.vsix
